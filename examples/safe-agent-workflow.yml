# Example: Safe AI Agent Workflow Configuration
# This workflow passes Shrike's security checks

name: Safe AI Agent

on:
  pull_request:  # Not pull_request_target
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest

    # Use explicit read-only permissions
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: AI Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # Safe: No untrusted input interpolation
          prompt: "Review the changes in this PR for security issues"

          # No dangerous tools
          claude_args: ""

          # Restrict to repository collaborators only
          allowed_non_write_users: ""  # Empty = only collaborators

        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Safe: Read-only operations
      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            // Use GitHub API to post review
            // (Read-only token, no code execution)
